name: Backtest

# Regner sidens ærlige backtest i en rigtig browser og gemmer den i data/backtest.json, som siden læser.
# Open-Meteos tjeneste for gamle prognoser er langsom og nogle gange nede; fejler den, beholdes den forrige fil.
# To planlagte forsøg om natten, fordi GitHub ofte springer kørsler over.
on:
  schedule:
    - cron: "40 2 * * *"
    - cron: "40 8 * * *"
  push:
    branches: [main]
    paths: [index.html, tools/backtest.mjs, .github/workflows/backtest.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Installer Playwright
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Regn backtest
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node tools/backtest.mjs "http://localhost:8000/?backtest=1"
      - name: Gem backtest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/backtest.json
          if git diff --cached --quiet; then echo "Uændret"; exit 0; fi
          git commit -m "Opdater backtest $(date -u +%FT%H:%MZ)"
          git checkout -- .
          # Op til 3 forsøg: GitHub svarer af og til med en midlertidig serverfejl, eller et andet workflow har lige pushet
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Forsøg $i fejlede, prøver igen om $((i*15)) sek."
            sleep $((i*15))
          done
          exit 1
